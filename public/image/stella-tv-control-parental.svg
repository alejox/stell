<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="450" height="600" role="img" aria-label="Control parental con clave en la aplicación de Stella TV">
  <defs>
    <linearGradient id="lockGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEB500"/>
      <stop offset="1" stop-color="#D62D08"/>
    </linearGradient>
  </defs>

  <rect width="450" height="600" rx="24" fill="#0B0B0C"/>
  <circle cx="225" cy="300" r="200" fill="url(#lockGold)" opacity=".1"/>

  <!-- Phone -->
  <rect x="115" y="60" width="220" height="440" rx="30" fill="#151517"/>
  <rect x="129" y="74" width="192" height="412" rx="22" fill="#0E0E10"/>
  <rect x="197" y="86" width="56" height="7" rx="3.5" fill="#ffffff" opacity=".18"/>

  <!-- Padlock -->
  <g transform="translate(225 210)">
    <path d="M-30-16v-20a30 30 0 0 1 60 0v20" stroke="url(#lockGold)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="-46" y="-16" width="92" height="76" rx="16" fill="url(#lockGold)"/>
    <circle cx="0" cy="18" r="9" fill="#0B0B0C"/>
    <rect x="-4" y="20" width="8" height="18" rx="4" fill="#0B0B0C"/>
  </g>

  <!-- PIN dots -->
  <g fill="#ffffff">
    <circle cx="159" cy="330" r="9" opacity=".85"/>
    <circle cx="203" cy="330" r="9" opacity=".85"/>
    <circle cx="247" cy="330" r="9" opacity=".85"/>
    <circle cx="291" cy="330" r="9" opacity=".2"/>
  </g>

  <!-- Keypad hint -->
  <g fill="#ffffff" opacity=".12">
    <rect x="150" y="372" width="46" height="34" rx="10"/>
    <rect x="202" y="372" width="46" height="34" rx="10"/>
    <rect x="254" y="372" width="46" height="34" rx="10"/>
    <rect x="150" y="416" width="46" height="34" rx="10"/>
    <rect x="202" y="416" width="46" height="34" rx="10"/>
    <rect x="254" y="416" width="46" height="34" rx="10"/>
  </g>

  <!-- Blocked category label -->
  <g>
    <rect x="115" y="524" width="220" height="44" rx="12" fill="#151517"/>
    <circle cx="145" cy="546" r="10" fill="url(#lockGold)"/>
    <text x="167" y="551" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" opacity=".6">Categoría bloqueada</text>
  </g>
</svg>
