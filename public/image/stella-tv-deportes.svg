<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" width="600" height="376" role="img" aria-label="Deportes en vivo en Stella TV">
  <defs>
    <linearGradient id="sportGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEB500"/>
      <stop offset="1" stop-color="#D62D08"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEB500" stop-opacity=".16"/>
      <stop offset="1" stop-color="#EEB500" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <rect width="600" height="376" fill="#0B0B0C"/>

  <!-- Pitch in perspective -->
  <path d="M120 330L60 96h480l-60 234z" fill="url(#pitch)"/>
  <g stroke="#ffffff" stroke-opacity=".22" fill="none" stroke-width="2">
    <path d="M120 330L60 96h480l-60 234z"/>
    <path d="M90 213h420"/>
    <ellipse cx="300" cy="213" rx="62" ry="30"/>
    <path d="M232 96h136v46H232z"/>
    <path d="M196 330h208v-52H196z"/>
  </g>

  <!-- Ball -->
  <circle cx="300" cy="213" r="15" fill="#ffffff"/>
  <path d="M300 202l9 7-3 11h-12l-3-11z" fill="#0B0B0C"/>

  <!-- Live scoreboard -->
  <g>
    <rect x="60" y="36" width="200" height="44" rx="10" fill="#151517"/>
    <circle cx="84" cy="58" r="6" fill="url(#sportGold)"/>
    <rect x="100" y="50" width="52" height="8" rx="4" fill="#ffffff" opacity=".5"/>
    <rect x="100" y="64" width="86" height="6" rx="3" fill="#ffffff" opacity=".2"/>
    <text x="212" y="64" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2-1</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#ffffff" opacity=".5">
    <text x="340" y="62">+90 SEÑALES</text>
  </g>
</svg>
