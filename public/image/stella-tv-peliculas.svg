<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" width="600" height="376" role="img" aria-label="Películas en Stella TV">
  <defs>
    <linearGradient id="movieGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEB500"/>
      <stop offset="1" stop-color="#D62D08"/>
    </linearGradient>
    <linearGradient id="movieGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="376" fill="#0B0B0C"/>
  <ellipse cx="300" cy="188" rx="230" ry="150" fill="url(#movieGold)" opacity=".14"/>

  <!-- Film strip, tilted -->
  <g transform="rotate(-8 300 188)">
    <rect x="60" y="118" width="480" height="140" rx="12" fill="#151517"/>
    <g fill="#0B0B0C">
      <rect x="60" y="118" width="480" height="22"/>
      <rect x="60" y="236" width="480" height="22"/>
    </g>
    <g fill="#ffffff" opacity=".25">
      <rect x="78" y="123" width="18" height="12" rx="3"/>
      <rect x="126" y="123" width="18" height="12" rx="3"/>
      <rect x="174" y="123" width="18" height="12" rx="3"/>
      <rect x="222" y="123" width="18" height="12" rx="3"/>
      <rect x="270" y="123" width="18" height="12" rx="3"/>
      <rect x="318" y="123" width="18" height="12" rx="3"/>
      <rect x="366" y="123" width="18" height="12" rx="3"/>
      <rect x="414" y="123" width="18" height="12" rx="3"/>
      <rect x="462" y="123" width="18" height="12" rx="3"/>
      <rect x="78" y="241" width="18" height="12" rx="3"/>
      <rect x="126" y="241" width="18" height="12" rx="3"/>
      <rect x="174" y="241" width="18" height="12" rx="3"/>
      <rect x="222" y="241" width="18" height="12" rx="3"/>
      <rect x="270" y="241" width="18" height="12" rx="3"/>
      <rect x="318" y="241" width="18" height="12" rx="3"/>
      <rect x="366" y="241" width="18" height="12" rx="3"/>
      <rect x="414" y="241" width="18" height="12" rx="3"/>
      <rect x="462" y="241" width="18" height="12" rx="3"/>
    </g>
    <g>
      <rect x="80" y="150" width="130" height="76" rx="8" fill="url(#movieGlass)"/>
      <rect x="228" y="150" width="130" height="76" rx="8" fill="url(#movieGold)" opacity=".9"/>
      <rect x="376" y="150" width="130" height="76" rx="8" fill="url(#movieGlass)"/>
    </g>
    <circle cx="293" cy="188" r="22" fill="#0B0B0C" opacity=".5"/>
    <path d="M286 177l19 11-19 11z" fill="#ffffff"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#ffffff" opacity=".5">
    <text x="60" y="330">ESTRENOS Y CINE CLÁSICO</text>
  </g>
</svg>
