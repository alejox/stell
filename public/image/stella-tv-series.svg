<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" width="600" height="376" role="img" aria-label="Series y novelas en Stella TV">
  <defs>
    <linearGradient id="seriesGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEB500"/>
      <stop offset="1" stop-color="#D62D08"/>
    </linearGradient>
    <linearGradient id="seriesFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="376" fill="#0B0B0C"/>
  <circle cx="300" cy="120" r="200" fill="url(#seriesGold)" opacity=".12"/>

  <!-- Poster shelf -->
  <g>
    <rect x="40" y="96" width="92" height="140" rx="10" fill="url(#seriesFade)"/>
    <rect x="146" y="76" width="92" height="160" rx="10" fill="url(#seriesFade)"/>
    <rect x="252" y="56" width="96" height="180" rx="12" fill="url(#seriesGold)" opacity=".85"/>
    <rect x="362" y="76" width="92" height="160" rx="10" fill="url(#seriesFade)"/>
    <rect x="468" y="96" width="92" height="140" rx="10" fill="url(#seriesFade)"/>
  </g>

  <!-- Play badge on the featured poster -->
  <circle cx="300" cy="146" r="26" fill="#0B0B0C" opacity=".55"/>
  <path d="M292 134l22 12-22 12z" fill="#ffffff"/>

  <!-- Season progress rows -->
  <g fill="#ffffff">
    <rect x="40" y="272" width="180" height="8" rx="4" opacity=".22"/>
    <rect x="40" y="272" width="120" height="8" rx="4" fill="url(#seriesGold)"/>
    <rect x="40" y="300" width="240" height="8" rx="4" opacity=".14"/>
    <rect x="40" y="300" width="64" height="8" rx="4" fill="url(#seriesGold)" opacity=".7"/>
    <rect x="40" y="328" width="140" height="8" rx="4" opacity=".1"/>
  </g>

  <g fill="#ffffff" opacity=".5" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2">
    <text x="360" y="308">TEMPORADAS COMPLETAS</text>
  </g>
</svg>
